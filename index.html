<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team TouchType</title>
  <meta name="description" content="Team TouchType is an independent games studio. Now making Legion: Rise of the Order.">
  <meta name="theme-color" content="#0b0c10">
  <link rel="icon" type="image/svg+xml" href="assets/touchtype.svg">

  <meta property="og:title" content="Team TouchType">
  <meta property="og:description" content="Independent games studio. Now making Legion: Rise of the Order.">
  <meta property="og:image" content="https://teamtouchtype.com/assets/og.jpg">
  <meta property="og:url" content="https://teamtouchtype.com/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="Team TouchType home">
      <span class="key" aria-hidden="true">T</span><span class="key" aria-hidden="true">T</span>
      <span class="brand-name">Team TouchType</span>
    </a>
    <nav><a href="#games">Games</a></nav>
  </header>

  <main>
    <section class="hero">
      <h1>
        <span class="row">Team</span>
        <span class="row">TouchType<span class="caret" aria-hidden="true"></span></span>
      </h1>
      <p class="lede">An independent games studio.</p>
    </section>

    <section id="games" class="games">
      <h2>Games</h2>

      <a class="game game--legion" href="/legion/">
        <div class="game-art" aria-hidden="true"></div>
        <div class="game-body">
          <p class="game-logo">Legion</p>
          <p class="game-sub">Rise of the Order</p>
          <ul class="tags">
            <li>Card battler</li>
            <li>PC</li>
            <li class="soon">Coming soon</li>
          </ul>
        </div>
        <ul class="fan" aria-hidden="true">
          <li><img src="assets/card-22.webp" alt="" width="512" height="512" loading="lazy"></li>
          <li><img src="assets/card-23.webp" alt="" width="512" height="512" loading="lazy"></li>
          <li><img src="assets/card-161.webp" alt="" width="512" height="512" loading="lazy"></li>
          <li><img src="assets/card-21.webp" alt="" width="512" height="512" loading="lazy"></li>
        </ul>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
    </section>
  </main>

  <footer>&copy; <span id="y">2026</span> Team TouchType</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
